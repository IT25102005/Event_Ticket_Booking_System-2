<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | Event Ticket Booking</title>
    <!-- Same shared stylesheet used by Ticket Dashboard -->
    <link rel="stylesheet" href="css/event-management.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<div class="layout">
    <!-- SIDEBAR — matches Ticket Dashboard structure exactly -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="ph ph-users"></i></div>
            <div>
                <h2>UserHub</h2>
                <span>User Management</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Main</div>
            <a href="admin-user-dashboard.html" class="nav-item active">
                 Dashboard
            </a>
            <div class="nav-section-label">Navigate</div>
            <a href="admin-portal.html" class="nav-item">
                <span class="icon"><i class="ph ph-house"></i></span> Home
            </a>
        </nav>
        <div class="sidebar-footer">SE1020 OOP Group Project</div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header class="top-header">
            <div class="page-title">
                <h1>User Management</h1>
                <p>View, filter, and manage all registered users</p>
            </div>
        </header>

        <div class="page-body">

            <!-- STAT CARDS — same structure as Ticket Dashboard -->
            <div class="stats-grid">
                <div class="stat-card" style="--card-color:#6366f1">
                    <div class="stat-icon" style="background:rgba(99,102,241,0.15);font-size:22px"><i class="ph ph-users"></i></div>
                    <div class="stat-info">
                        <h3 id="totalUsers">—</h3>
                        <p>Total Users</p>
                    </div>
                </div>
                <div class="stat-card" style="--card-color:rgba(16,185,129,0.55)">
                    <div class="stat-icon" style="background:rgba(16,185,129,0.12);font-size:22px"><i class="ph ph-check-circle"></i></div>
                    <div class="stat-info">
                        <h3 id="activeUsers">—</h3>
                        <p>Active Users</p>
                    </div>
                </div>
                <div class="stat-card" style="--card-color:#8b5cf6">
                    <div class="stat-icon" style="background:rgba(139,92,246,0.12);font-size:22px"><i class="ph ph-shield-check"></i></div>
                    <div class="stat-info">
                        <h3 id="adminUsers">—</h3>
                        <p>Admins</p>
                    </div>
                </div>
                <div class="stat-card" style="--card-color:#6366f1">
                    <div class="stat-icon" style="background:rgba(99,102,241,0.12);font-size:22px"><i class="ph ph-user"></i></div>
                    <div class="stat-info">
                        <h3 id="customerUsers">—</h3>
                        <p>Customers</p>
                    </div>
                </div>
            </div>

            <!-- FILTER BAR — matches Ticket Dashboard filter bar -->
            <div class="filter-bar">
                <div class="search-box">
                    <span class="search-icon"><i class="ph ph-magnifying-glass"></i></span>
                    <input type="text" id="searchInput" placeholder="Search by name or email..." oninput="filterData()">
                </div>
                <select class="filter-select" id="roleFilter" onchange="filterData()">
                    <option value="ALL">All Roles</option>
                    <option value="ADMIN">Admin</option>
                    <option value="CUSTOMER">Customer</option>
                </select>
                <select class="filter-select" id="statusFilter" onchange="filterData()">
                    <option value="ALL">All Status</option>
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                    <option value="SUSPENDED">Suspended</option>
                </select>
                <button class="btn btn-outline" onclick="clearFilters()"><i class="ph ph-x"></i> Clear</button>
            </div>

            <!-- TABLE CONTAINER — matches Ticket Dashboard detail-card/table -->
            <div class="detail-card">
                <div style="overflow-x:auto">
                    <table style="width:100%;border-collapse:collapse;font-size:14px">
                        <thead>
                            <tr style="background:rgba(99,102,241,0.1);border-bottom:1px solid var(--border)">
                                <th style="padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">User</th>
                                <th style="padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Email</th>
                                <th style="padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Role</th>
                                <th style="padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Status</th>
                                <th style="padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr>
                                <td colspan="5" style="padding:60px;text-align:center;color:var(--text-muted)">
                                    <div class="loading-spinner"><div class="spinner"></div><span>Loading users...</span></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div><!-- /page-body -->
    </div><!-- /main-content -->
</div><!-- /layout -->

<script src="js/config.js"></script>
<script>
    // ─── All original user-management.js logic inlined ───
    // (user-management.js still loaded for global viewUser / editUser / deleteUser)
    // We duplicate the render here so it renders into the new 5-column table.

    const roleColors  = { ADMIN:'rgba(168,85,247,0.15)',  CUSTOMER:'rgba(6,182,212,0.15)' };
    const roleText    = { ADMIN:'#c084fc',                CUSTOMER:'#22d3ee' };
    const statColors  = { ACTIVE:'rgba(16,185,129,0.15)', INACTIVE:'rgba(100,116,139,0.15)', SUSPENDED:'rgba(239,68,68,0.15)' };
    const statText    = { ACTIVE:'#10b981',               INACTIVE:'#64748b',                SUSPENDED:'#ef4444' };

    let allUsers = [];

    async function fetchUsers() {
        try {
            const res = await fetch(`${API_BASE_URL}/users`);
            if (!res.ok) throw new Error('Server error: ' + res.status);
            allUsers = await res.json();
            renderUsers(allUsers);
        } catch (err) {
            console.error('Error fetching users:', err);
            document.getElementById('userTableBody').innerHTML =
                `<tr><td colspan="5" style="padding:60px;text-align:center;color:var(--danger)">
                    <i class="ph ph-warning"></i> Could not load users — make sure the backend is running on port 8080.
                </td></tr>`;
        }
    }

    function renderUsers(users) {
        const tbody = document.getElementById('userTableBody');
        if (!users || users.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="padding:40px;text-align:center;color:var(--text-muted)">No users found.</td></tr>`;
            updateSummaryCards([]);
            return;
        }

        tbody.innerHTML = users.map(user => {
            const firstName = user.firstName || '';
            const lastName  = user.lastName  || '';
            const initials  = `${firstName.charAt(0)}${lastName.charAt(0)}`.toUpperCase() || '?';
            const role   = user.role   || 'CUSTOMER';
            const status = user.status || 'ACTIVE';
            const id     = user.userId || user.id;

            const rc = roleColors[role]  || 'rgba(99,102,241,0.15)';
            const rt = roleText[role]    || '#a5b4fc';
            const sc = statColors[status] || 'rgba(99,102,241,0.15)';
            const st = statText[status]   || '#a5b4fc';

            return `<tr style="border-bottom:1px solid var(--border);transition:background 0.2s"
                        onmouseover="this.style.background='var(--bg-card-hover)'"
                        onmouseout="this.style.background=''">
                <td style="padding:14px 16px">
                    <div style="display:flex;align-items:center;gap:12px">
                        <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));
                                    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0">
                            ${initials}
                        </div>
                        <span style="font-weight:600;color:var(--text-primary)">${firstName} ${lastName}</span>
                    </div>
                </td>
                <td style="padding:14px 16px;color:var(--text-secondary)">${user.email || '—'}</td>
                <td style="padding:14px 16px">
                    <span style="background:${rc};color:${rt};padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase">${role}</span>
                </td>
                <td style="padding:14px 16px">
                    <span style="background:${sc};color:${st};padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase">${status}</span>
                </td>
                <td style="padding:14px 16px">
                    <div style="display:flex;gap:6px">
                        <button class="btn btn-sm btn-success" onclick="viewUser(${id})">View</button>
                        <button class="btn btn-sm btn-warning" onclick="editUser(${id})">Edit</button>
                        <button class="btn btn-sm btn-danger"  onclick="deleteUser(${id}, this)">Delete</button>
                    </div>
                </td>
            </tr>`;
        }).join('');

        updateSummaryCards(users);
    }

    function updateSummaryCards(users) {
        const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
        set('totalUsers',    users.length);
        set('activeUsers',   users.filter(u => u.status === 'ACTIVE').length);
        set('adminUsers',    users.filter(u => u.role === 'ADMIN').length);
        set('customerUsers', users.filter(u => u.role === 'CUSTOMER').length);
    }

    function filterData() {
        const q  = (document.getElementById('searchInput')?.value  || '').toLowerCase();
        const r  = document.getElementById('roleFilter')?.value   || 'ALL';
        const s  = document.getElementById('statusFilter')?.value || 'ALL';
        const filtered = allUsers.filter(u => {
            const name  = `${u.firstName||''} ${u.lastName||''}`.toLowerCase();
            const email = (u.email||'').toLowerCase();
            return (name.includes(q) || email.includes(q))
                && (r === 'ALL' || u.role   === r)
                && (s === 'ALL' || u.status === s);
        });
        renderUsers(filtered);
    }

    function clearFilters() {
        document.getElementById('searchInput').value  = '';
        document.getElementById('roleFilter').value   = 'ALL';
        document.getElementById('statusFilter').value = 'ALL';
        renderUsers(allUsers);
    }

    // Global actions (kept identical to user-management.js)
    function viewUser(id)   { window.location.href = `user-details.html?id=${id}`; }
    function editUser(id)   { window.location.href = `edit-profile.html?id=${id}`; }
    async function deleteUser(id, btn) {
        if (!confirm('Are you sure you want to delete this user?')) return;
        try {
            btn.disabled = true; btn.textContent = '...';
            const res = await fetch(`${API_BASE_URL}/users/${id}`, { method: 'DELETE' });
            if (res.ok) { alert('User deleted successfully!'); location.reload(); }
            else { alert('Failed to delete user. They may have associated data.'); btn.disabled = false; btn.textContent = 'Delete'; }
        } catch { alert('Cannot connect to server.'); btn.disabled = false; btn.textContent = 'Delete'; }
    }

    fetchUsers();
</script>
</body>
</html>
