<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details | Event Ticket Booking</title>
    <link rel="stylesheet" href="css/event-management.css">
    <style>
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .detail-item label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .detail-item span {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .user-avatar-lg {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 800; color: #fff;
            box-shadow: 0 8px 24px rgba(99,102,241,0.35);
            flex-shrink: 0;
        }
        .action-row { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid var(--border); }
        #actionMsg { margin-top: 14px; font-size: 14px; font-weight: 600; }
        @media(max-width:600px) { .detail-grid { grid-template-columns: 1fr; } }
    </style>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="ph ph-users"></i></div>
            <div>
                <h2>UserHub</h2>
                <span>User Management</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Main</div>
            <a href="admin-user-dashboard.html" class="nav-item active">
                 Dashboard
            </a>
            <div class="nav-section-label">Navigate</div>
            <a href="admin-portal.html" class="nav-item"><span class="icon"><i class="ph ph-house"></i></span> Home</a>
            <a href="event-dashboard.html" class="nav-item"><span class="icon"><i class="ph ph-calendar-star"></i></span> Events</a>
            <a href="booking-dashboard.html" class="nav-item"><span class="icon"><i class="ph ph-ticket"></i></span> Bookings</a>
            <a href="payment-dashboard.html" class="nav-item"><span class="icon"><i class="ph ph-credit-card"></i></span> Payments</a>
        </nav>
        <div class="sidebar-footer">SE1020 OOP Group Project</div>
    </aside>

    <!-- MAIN -->
    <div class="main-content">
        <header class="top-header">
            <div class="page-title">
                <h1>User Details</h1>
                <p>View and manage individual user account</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="location.href='admin-user-dashboard.html'">← Back</button>
            </div>
        </header>

        <div class="page-body">
            <div class="detail-card" id="user-card" style="max-width:760px">

                <!-- Loading state -->
                <div id="loading-state" style="text-align:center;padding:60px;color:var(--text-muted)">
                    <div class="loading-spinner"><div class="spinner"></div><span>Loading user...</span></div>
                </div>

                <!-- Loaded state (hidden until data arrives) -->
                <div id="user-content" style="display:none">
                    <!-- Header -->
                    <div style="display:flex;align-items:center;gap:20px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--border)">
                        <div class="user-avatar-lg" id="uInitials">?</div>
                        <div style="flex:1">
                            <h2 id="uName" style="font-size:24px;font-weight:800;color:var(--text-primary);margin-bottom:8px">—</h2>
                            <div style="display:flex;gap:8px;align-items:center">
                                <span id="uRoleBadge" style="padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase">—</span>
                                <span id="uStatusBadge" style="padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase">—</span>
                            </div>
                        </div>
                    </div>

                    <!-- Data grid -->
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>User ID</label>
                            <span id="uId">—</span>
                        </div>
                        <div class="detail-item">
                            <label>Username</label>
                            <span id="uUsername">—</span>
                        </div>
                        <div class="detail-item">
                            <label>Email</label>
                            <span id="uEmail">—</span>
                        </div>
                        <div class="detail-item">
                            <label>Phone</label>
                            <span id="uPhone">—</span>
                        </div>
                        <div class="detail-item">
                            <label>Address</label>
                            <span id="uAddress">—</span>
                        </div>
                        <div class="detail-item">
                            <label>Joined Date</label>
                            <span id="uDate">—</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="action-row">
                        <button class="btn btn-success"  onclick="updateStatus('ACTIVE')"><i class="ph ph-check-circle"></i> Activate</button>
                        <button class="btn btn-warning"  onclick="updateStatus('SUSPENDED')"> Suspend</button>
                        <button class="btn btn-danger"   onclick="deleteUser()"> Delete User</button>
                    </div>
                    <div id="actionMsg"></div>
                </div>

                <!-- Error state -->
                <div id="error-state" style="display:none;text-align:center;padding:60px;color:var(--danger)">
                    <i class="ph ph-warning"></i> Could not load user. Please check the backend is running.
                </div>

            </div>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('id');

    const roleColors  = { ADMIN:'rgba(168,85,247,0.15)',  CUSTOMER:'rgba(6,182,212,0.15)' };
    const roleText    = { ADMIN:'#c084fc',                CUSTOMER:'#22d3ee' };
    const statColors  = { ACTIVE:'rgba(16,185,129,0.15)', INACTIVE:'rgba(100,116,139,0.15)', SUSPENDED:'rgba(239,68,68,0.15)' };
    const statText    = { ACTIVE:'#10b981',               INACTIVE:'#64748b',                SUSPENDED:'#ef4444' };

    async function loadUser() {
        if (!userId) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display  = 'block';
            document.getElementById('error-state').textContent    = '<i class="ph ph-warning"></i> No user ID in URL. Go back and click View on a user.';
            return;
        }
        try {
            const res = await fetch(`${API_BASE_URL}/users/${userId}`);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const u = await res.json();
            renderUser(u);
        } catch (e) {
            console.error(e);
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display   = 'block';
        }
    }

    function renderUser(u) {
        const firstName = u.firstName || '';
        const lastName  = u.lastName  || '';
        const initials  = `${firstName.charAt(0)}${lastName.charAt(0)}`.toUpperCase() || '?';
        const role   = u.role   || 'CUSTOMER';
        const status = u.status || 'ACTIVE';

        document.getElementById('uInitials').textContent = initials;
        document.getElementById('uName').textContent     = `${firstName} ${lastName}`.trim() || u.username || '—';
        document.getElementById('uId').textContent       = u.userId || u.id || '—';
        document.getElementById('uUsername').textContent = u.username || '—';
        document.getElementById('uEmail').textContent    = u.email    || '—';
        document.getElementById('uPhone').textContent    = u.phoneNumber || u.phone || '—';
        document.getElementById('uAddress').textContent  = u.address  || '—';
        document.getElementById('uDate').textContent     = u.createdAt
            ? new Date(u.createdAt).toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'})
            : (u.joinedDate || '—');

        const roleBadge = document.getElementById('uRoleBadge');
        roleBadge.textContent = role;
        roleBadge.style.background = roleColors[role]  || 'rgba(99,102,241,0.15)';
        roleBadge.style.color      = roleText[role]    || '#a5b4fc';

        const statusBadge = document.getElementById('uStatusBadge');
        statusBadge.textContent = status;
        statusBadge.style.background = statColors[status] || 'rgba(99,102,241,0.15)';
        statusBadge.style.color      = statText[status]   || '#a5b4fc';

        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('user-content').style.display  = 'block';
    }

    async function updateStatus(newStatus) {
        if (!confirm(`Change this user's status to ${newStatus}?`)) return;
        const endpoint = newStatus === 'ACTIVE' ? 'activate' : 'deactivate';
        try {
            const res = await fetch(`${API_BASE_URL}/users/${userId}/${endpoint}`, { method: 'PATCH' });
            if (res.ok) {
                const msg = document.getElementById('actionMsg');
                const statusBadge = document.getElementById('uStatusBadge');
                statusBadge.textContent = newStatus;
                statusBadge.style.background = statColors[newStatus] || 'rgba(99,102,241,0.15)';
                statusBadge.style.color      = statText[newStatus]   || '#a5b4fc';
                msg.innerHTML = `<span style="color:var(--success)"><i class="ph ph-check-circle"></i> Status updated to ${newStatus}.</span>`;
                setTimeout(() => msg.innerHTML = '', 3000);
            } else {
                alert('Failed to update status.');
            }
        } catch { alert('Cannot connect to server.'); }
    }

    async function deleteUser() {
        if (!confirm('WARNING: Permanently delete this user?')) return;
        try {
            const res = await fetch(`${API_BASE_URL}/users/${userId}`, { method: 'DELETE' });
            if (res.ok) {
                document.getElementById('actionMsg').innerHTML =
                    `<span style="color:var(--danger)"> User deleted.</span>`;
                setTimeout(() => location.href = 'admin-user-dashboard.html', 1500);
            } else {
                alert('Failed to delete user. They may have associated data.');
            }
        } catch { alert('Cannot connect to server.'); }
    }

    loadUser();
</script>
</body>
</html>
