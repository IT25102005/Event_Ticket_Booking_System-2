<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | EventBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/event-management.css">
    <style>
        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15,15,26,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 40px; height: 70px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, var(--primary-light), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }

        .dashboard-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }

        /* Profile Header */
        .profile-header { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; display: flex; align-items: center; gap: 30px; margin-bottom: 40px; position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(99,102,241,0.1); }
        .profile-header::after { content:''; position:absolute; top:0; right:0; width:300px; height:100%; background:linear-gradient(90deg, transparent, rgba(99,102,241,0.08)); pointer-events:none; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; color: white; box-shadow: 0 10px 30px rgba(99,102,241,0.4); flex-shrink: 0; }
        .profile-info h1 { font-size: 28px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
        .profile-info p { color: var(--text-secondary); font-size: 15px; margin-bottom: 4px; }
        .role-badge { display: inline-block; background: rgba(16,185,129,0.15); color: var(--success); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1px solid rgba(16,185,129,0.3); margin-top: 10px; }

        .section-title { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }

        /* Booking Cards */
        .bookings-grid { display: grid; gap: 20px; }
        .booking-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; transition: all 0.3s; }
        .booking-card:hover { border-color: rgba(99,102,241,0.45); box-shadow: 0 8px 28px rgba(0,0,0,0.25); transform: translateY(-2px); }
        .booking-info h3 { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .booking-info p { color: var(--text-secondary); font-size: 14px; margin-bottom: 4px; }

        /* Status badges */
        .booking-status { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
        .status-badge { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
        .status-confirmed { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
        .status-pending   { background: rgba(245,158,11,0.15);  color: #f59e0b;       border: 1px solid rgba(245,158,11,0.3); }
        .status-cancelled { background: rgba(239,68,68,0.15);   color: var(--danger);  border: 1px solid rgba(239,68,68,0.3); }
        .booking-price { font-size: 20px; font-weight: 800; color: var(--text-primary); }

        /* Empty state */
        .empty-state { text-align: center; padding: 60px 20px; background: var(--bg-card); border: 1px dashed var(--border); border-radius: var(--radius); color: var(--text-muted); }
        .empty-state h3 { font-size: 20px; margin-bottom: 10px; color: var(--text-primary); }

        /* Pay button */
        .btn-pay { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 9px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; display: inline-block; transition: all 0.25s; font-family: 'Inter', sans-serif; }
        .btn-pay:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,0.4); }
        .btn-pay:active { transform: scale(0.97); }

        /* Gateway input styles */
        .gw-input { width: 100%; padding: 13px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-input); color: var(--text-primary); font-size: 15px; font-family: 'Inter', sans-serif; outline: none; transition: all 0.2s; }
        .gw-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .gw-input::placeholder { color: var(--text-muted); }
        .gw-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Modal overlay */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .modal h2 { font-size: 22px; margin-bottom: 12px; color: var(--text-primary); }
        .modal p  { color: var(--text-secondary); margin-bottom: 28px; font-size: 15px; }

        @media (max-width: 600px) {
            .booking-card { flex-direction: column; align-items: flex-start; }
            .booking-status { align-items: flex-start; }
            nav { padding: 0 16px; }
        }
    </style>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo"><i class="ph ph-ticket"></i> EventBook</a>
    <div style="display: flex; gap: 15px; align-items: center;">
        <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">Home</a>
        <a href="#" id="admin-link" style="display:none; color: var(--primary-light); text-decoration: none; font-weight: 500; border: 1px solid var(--primary); padding: 6px 12px; border-radius: 6px;">Admin Portal</a>
        <button onclick="logout()" class="btn btn-outline" style="padding: 6px 16px;">Logout</button>
    </div>
</nav>

<div class="dashboard-container">
    <div class="profile-header">
        <div class="profile-avatar" id="avatar-initial">U</div>
        <div class="profile-info">
            <h1 id="user-name">Loading...</h1>
            <p id="user-email">...</p>
            <p id="user-phone">...</p>
            <div class="role-badge" id="user-role">CUSTOMER</div>
        </div>
    </div>

    <h2 class="section-title"><i class="ph ph-ticket"></i> My Bookings</h2>
    
    <div class="bookings-grid" id="bookings-list">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">Loading bookings...</div>
    </div>
</div>

<!-- Payment Gateway Modal -->
<div class="modal-overlay" id="gateway-modal">
    <div class="modal" style="max-width: 480px; text-align: left; background: var(--bg-card); border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.6); padding: 30px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px;">
            <h3 style="margin: 0; color: var(--text-primary); font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 22px; color: var(--primary-light);"><i class="ph ph-credit-card"></i></span> PaymentHub Gateway
            </h3>
            <button onclick="closeGatewayModal()" style="background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; transition: 0.2s; line-height: 1;">X</button>
        </div>

        <div id="card-gateway-fields">
            <div style="margin-bottom: 16px;">
                <label class="gw-label">Card Number</label>
                <input type="text" id="card-number" placeholder="4111 2222 3333 4444" maxlength="19" oninput="formatCardNumber(this)" class="gw-input">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                <div>
                    <label class="gw-label">Expiry Date</label>
                    <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5" oninput="formatCardExpiry(this)" class="gw-input">
                </div>
                <div>
                    <label class="gw-label">CVV</label>
                    <input type="password" id="card-cvv" placeholder="•••" maxlength="3" class="gw-input">
                </div>
            </div>
            <div style="margin-bottom: 24px;">
                <label class="gw-label">Cardholder Name</label>
                <input type="text" id="card-name" placeholder="John Doe" class="gw-input">
            </div>
        </div>

        <div id="gateway-loading" style="display: none; text-align: center; padding: 20px 0;">
            <div class="spinner" style="margin: 0 auto 20px; border-color: var(--border); border-top-color: var(--primary-light);"></div>
            <h4 id="gateway-loading-text" style="color: var(--text-primary); font-size: 16px; margin-bottom: 8px; font-weight: 600;">Processing Payment...</h4>
            <p style="color: var(--text-muted); font-size: 13px;">Please do not close this window.</p>
        </div>

        <div id="gateway-actions">
            <button class="btn-pay" id="gateway-pay-btn" onclick="submitPayment()" style="width:100%; padding: 15px; font-size: 15px;">Pay Now</button>
        </div>
    </div>
</div>

<!-- Success Modal -->
<div class="modal-overlay" id="success-modal">
    <div class="modal">
        <div class="modal-icon"></div>
        <h2>Payment Successful!</h2>
        <p>Your tickets have been confirmed successfully.</p>
        <button class="btn btn-primary" onclick="location.reload()" style="width: 100%;">View My Tickets</button>
    </div>
</div>

<script>
    const API = 'http://localhost:8080/api';
    let currentUser = null;

    function initAuth() {
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = JSON.parse(userStr);
        
        const name = (currentUser.firstName + ' ' + currentUser.lastName).trim() || currentUser.username || 'User';
        document.getElementById('user-name').textContent = name;
        document.getElementById('avatar-initial').textContent = name.charAt(0).toUpperCase();
        document.getElementById('user-email').textContent = currentUser.email || 'No email provided';
        document.getElementById('user-phone').textContent = currentUser.phoneNumber || '';
        document.getElementById('user-role').textContent = currentUser.role || 'CUSTOMER';
        
        if (currentUser.role === 'ADMIN') {
            document.getElementById('admin-link').style.display = 'block';
            document.getElementById('admin-link').href = 'admin-portal.html';
        }

        loadUserBookings();
    }

    function logout() {
        localStorage.removeItem('user');
        window.location.href = 'index.html';
    }

    let selectedBookingId = null;
    let selectedAmount = 0;
    let selectedEventId = null;

    async function loadUserBookings() {
        const container = document.getElementById('bookings-list');
        try {
            const userId = currentUser.id || 1;
            const res = await fetch(`${API}/bookings/user/${userId}`);
            if (!res.ok) throw new Error('Failed to load bookings');
            let userBookings = await res.json();
            
            // Sort by latest (descending ID usually works if date is missing, but try bookingDate/createdAt)
            userBookings.sort((a,b) => b.id - a.id);

            if (userBookings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No tickets yet!</h3>
                        <p>You haven't booked any events yet. Head over to the home page to discover amazing experiences.</p>
                        <br>
                        <button class="btn btn-primary" onclick="location.href='index.html'">Browse Events</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = userBookings.map(b => {
                let statusClass = 'status-pending';

                const eventRef = b.eventCode ? `Event Code: ${b.eventCode}` : 'Event: TBA';
                const ticketsDetail = b.numberOfTickets ? `${b.numberOfTickets}x Ticket(s)` : '';
                const totalVal = (b.numberOfTickets || 0) * (b.ticketPrice || 0);
                
                const seatsInfo = (b.selectedSeats && b.selectedSeats.length > 0) 
                    ? `Seats: ${b.selectedSeats.map(s => s.seatNumber).join(', ')}` 
                    : 'No Seats Selected';

                const payMethodText = b.preferredPaymentMethod 
                    ? `<p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;">Payment Method: <strong>${b.preferredPaymentMethod}</strong></p>` 
                    : '';

                let actionBtn = '';
                if ((b.status === 'PENDING_PAYMENT' || b.status === 'PENDING') && (!b.paymentStatus || b.paymentStatus === 'PENDING')) {
                    if (b.preferredPaymentMethod === 'Bank Transfer') {
                        actionBtn = `
                            <label for="upload-slip-${b.id}" class="btn-pay" style="cursor: pointer; background: linear-gradient(135deg, #10b981, #059669); text-align: center;">Upload Slip</label>
                            <input type="file" id="upload-slip-${b.id}" accept="image/*,.pdf" style="display: none;" onchange="handleSlipUpload(${b.id}, ${totalVal}, ${b.eventId || 0}, this)">
                        `;
                    } else if (b.preferredPaymentMethod === 'Cash') {
                        actionBtn = `<div style="font-size: 12px; font-weight: 600; color: #64748b; padding: 8px 12px; border: 1px dashed #2d2d4e; border-radius: 8px; background: #16213e; text-align: center;">Pay at Counter</div>`;
                    } else {
                        actionBtn = `<button class="btn-pay" onclick="openPaymentGateway(${b.id}, ${totalVal}, ${b.eventId || 0})">Pay Rs. ${totalVal.toFixed(2)} Now</button>`;
                    }
                }
                
                let displayStatus = b.status || 'PENDING';
                if (b.paymentStatus === 'PAYMENT_SUCCESSFUL') {
                    displayStatus = 'Payment Successful';
                    statusClass = 'status-confirmed';
                } else if (b.paymentStatus === 'REFUND_PROCESSING') {
                    displayStatus = 'Refund Processing';
                    statusClass = 'status-pending';
                } else if (b.paymentStatus === 'PAYMENT_CANCELLED') {
                    displayStatus = 'Payment Cancelled';
                    statusClass = 'status-cancelled';
                }

                return `
                    <div class="booking-card">
                        <div class="booking-info">
                            <h3>Booking #${b.id}</h3>
                            <p style="color: var(--primary-light); font-weight: 600; margin-bottom: 4px;">${eventRef}</p>
                            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;">${ticketsDetail}</p>
                            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;">${seatsInfo}</p>
                            ${payMethodText}
                        </div>
                        <div class="booking-status">
                            <div class="status-badge ${statusClass}">${displayStatus}</div>
                            <div class="booking-price">Rs. ${totalVal.toFixed(2)}</div>
                            ${actionBtn}
                        </div>
                    </div>
                `;
            }).join('');

        } catch (err) {
            console.error(err);
            container.innerHTML = '<p style="color:var(--danger); text-align:center;">Could not load bookings from server.</p>';
        }
    }

    window.openPaymentGateway = function(bookingId, amount, eventId) {
        selectedBookingId = bookingId;
        selectedAmount = amount;
        selectedEventId = eventId;
        
        document.getElementById('gateway-modal').classList.add('active');
        document.getElementById('gateway-loading').style.display = 'none';
        document.getElementById('gateway-actions').style.display = 'block';
        document.getElementById('card-gateway-fields').style.display = 'block';
        document.getElementById('gateway-pay-btn').textContent = `Pay Rs. ${amount.toFixed(2)}`;
    }

    window.handleSlipUpload = async function(bookingId, amount, eventId, inputElem) {
        if (inputElem.files && inputElem.files.length > 0) {
            const fileName = inputElem.files[0].name;
            inputElem.value = '';
            try {
                // Step 1: Create a payment record for this Bank Transfer
                const paymentPayload = {
                    eventId: eventId,
                    userId: currentUser.id || 1,
                    bookingId: bookingId,
                    amount: amount,
                    paymentType: 'BANK_TRANSFER',
                    currency: 'USD',
                    description: `Bank Transfer slip uploaded for Booking #${bookingId} (file: ${fileName})`,
                    cardholderName: (currentUser.firstName || '') + ' ' + (currentUser.lastName || '')
                };
                const payRes = await fetch(`${API}/payments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(paymentPayload)
                });
                if (!payRes.ok) throw new Error('Failed to record payment');
                const payment = await payRes.json();

                // Step 2: Mark payment as SUCCESS and booking as PAYMENT_SUCCESSFUL
                const finalRes = await fetch(`${API}/payments/${payment.id}/status?status=SUCCESS`, {
                    method: 'PUT'
                });
                if (!finalRes.ok) throw new Error('Failed to finalize payment');

                alert(`Payment slip "${fileName}" uploaded successfully! Your booking has been confirmed.`);
                location.reload();
            } catch (e) {
                console.error(e);
                alert('Could not process slip upload: ' + e.message);
            }
        }
    }

    window.closeGatewayModal = function() {
        document.getElementById('gateway-modal').classList.remove('active');
    }

    window.formatCardNumber = function(input) {
        let value = input.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let formatted = '';
        for (let i = 0; i < value.length; i++) {
            if (i > 0 && i % 4 === 0) formatted += ' ';
            formatted += value[i];
        }
        input.value = formatted;
    }

    window.formatCardExpiry = function(input) {
        let value = input.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        if (value.length > 2) input.value = value.substring(0, 2) + '/' + value.substring(2, 4);
        else input.value = value;
    }

    window.submitPayment = async function() {
        const num = document.getElementById('card-number').value.trim();
        const cardName = document.getElementById('card-name').value.trim();
        if (!num) return alert('Please enter card details.');
        
        const cleanNum = num.replace(/\s+/g, '');
        const maskedNum = '**** **** **** ' + cleanNum.slice(-4);

        document.getElementById('card-gateway-fields').style.display = 'none';
        document.getElementById('gateway-actions').style.display = 'none';
        document.getElementById('gateway-loading').style.display = 'block';
        
        const delay = ms => new Promise(res => setTimeout(res, ms));
        
        try {
            await delay(1500); // Simulate processing
            
            const paymentPayload = {
                eventId: selectedEventId,
                userId: currentUser.id || 1,
                bookingId: selectedBookingId,
                amount: selectedAmount,
                paymentType: 'CARD',
                currency: "USD",
                description: `Payment for Online Booking ID #${selectedBookingId}`,
                maskedCardNumber: maskedNum,
                cardholderName: cardName || currentUser.firstName || 'Customer'
            };

            const payRes = await fetch(`${API}/payments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paymentPayload)
            });

            if (!payRes.ok) throw new Error('Payment creation failed');
            const payment = await payRes.json();
            
            await delay(1000);
            
            const finalizeRes = await fetch(`${API}/payments/${payment.id}/status?status=SUCCESS`, {
                method: 'PUT'
            });
            
            if (!finalizeRes.ok) throw new Error('Payment finalization failed');
            
            closeGatewayModal();
            document.getElementById('success-modal').classList.add('active');
        } catch (e) {
            console.error(e);
            alert('Payment failed: ' + e.message);
            closeGatewayModal();
        }
    }

    initAuth();
</script>
</body>
</html>
