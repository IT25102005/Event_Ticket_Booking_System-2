<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EventBooker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/user-management.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
            flex-shrink: 0;
        }

        .profile-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-glow);
        }

        .detail-item label {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 0.3rem;
        }

        .detail-item span {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .profile-actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
        }

        /* Override btn styles to use standard theme */
        .profile-actions .btn-primary {
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            transition: var(--transition);
        }

        .profile-actions .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .profile-actions .btn-outline {
            padding: 10px 22px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            transition: var(--transition);
        }

        .profile-actions .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary-light);
        }

        @media (max-width: 600px) {
            .profile-details-grid {
                grid-template-columns: 1fr;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <nav class="sidebar">
        <div class="logo-container">EventBooker</div>
        <ul class="nav-links">
            <li><a href="admin-user-dashboard.html">Dashboard</a></li>
            <li><a href="profile.html" class="active">My Profile</a></li>
            <li><a href="login.html" id="logoutBtn">Logout</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-avatar-large" id="profileAvatar">U</div>
                <div>
                    <h1 id="profileName">Loading...</h1>
                    <p id="profileRoleDesc" style="color: var(--text-secondary); margin-top: 0.5rem;"></p>
                    <div style="margin-top: 0.5rem;">
                        <span class="badge" id="roleBadge">ROLE</span>
                        <span class="badge" id="statusBadge">STATUS</span>
                    </div>
                </div>
            </div>

            <div class="profile-details-grid">
                <div class="detail-item">
                    <label>Username</label>
                    <span id="pUsername">-</span>
                </div>
                <div class="detail-item">
                    <label>Email</label>
                    <span id="pEmail">-</span>
                </div>
                <div class="detail-item">
                    <label>Phone Number</label>
                    <span id="pPhone">-</span>
                </div>
                <div class="detail-item">
                    <label>Address</label>
                    <span id="pAddress">-</span>
                </div>
                <div class="detail-item">
                    <label>Member Since</label>
                    <span id="pDate">-</span>
                </div>
            </div>

            <div class="profile-actions">
                <a href="edit-profile.html" class="btn-primary">Edit Profile</a>
                <a href="change-password.html" class="btn-outline">Change Password</a>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(userStr);

            document.getElementById('profileName').innerText = `${user.firstName} ${user.lastName}`;
            document.getElementById('profileAvatar').innerText = `${user.firstName.charAt(0)}${user.lastName.charAt(0)}`.toUpperCase();
            document.getElementById('profileRoleDesc').innerText = user.roleDescription || 'User';

            const roleBadge = document.getElementById('roleBadge');
            roleBadge.innerText = user.role;
            roleBadge.className = `badge role-${user.role.toLowerCase()}`;

            const statusBadge = document.getElementById('statusBadge');
            statusBadge.innerText = user.status;
            statusBadge.className = `badge status-${user.status.toLowerCase()}`;

            document.getElementById('pUsername').innerText = user.username;
            document.getElementById('pEmail').innerText = user.email;
            document.getElementById('pPhone').innerText = user.phoneNumber || 'Not provided';
            document.getElementById('pAddress').innerText = user.address || 'Not provided';

            if (user.createdAt) {
                const date = new Date(user.createdAt);
                document.getElementById('pDate').innerText = date.toLocaleDateString();
            }

            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('user');
            });
        });
    </script>
</body>

</html>
