<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EventBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #a5b4fc;
            --secondary: #8b5cf6; --accent: #06b6d4;
            --bg-dark: #0f0f1a; --bg-card: #1a1a2e; --bg-input: #16213e;
            --border: #2d2d4e; --text-primary: #f1f5f9; --text-secondary: #94a3b8;
            --text-muted: #64748b; --danger: #ef4444; --success: #10b981;
            --shadow-glow: 0 0 40px rgba(99,102,241,0.18);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px 20px;
            position: relative; overflow-x: hidden;
        }
        /* Ambient radial glow matching Home Page hero */
        body::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(99,102,241,0.13), transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Card */
        .auth-wrapper {
            max-width: 600px; width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(0,0,0,0.55), var(--shadow-glow);
            padding: 48px 48px 40px;
            position: relative; z-index: 1;
        }

        /* Header */
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-header .logo {
            font-size: 32px;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 14px; display: block;
        }
        .auth-header h2 { font-size: 1.55rem; font-weight: 700; margin-bottom: 6px; color: var(--text-primary); }
        .auth-header p  { color: var(--text-muted); font-size: 14px; }

        /* Form grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }

        .form-group input,
        .form-group select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 14px;
            color: var(--text-primary);
            font-size: 14px; font-family: 'Inter', sans-serif;
            outline: none; transition: all 0.2s; width: 100%;
        }
        .form-group input:focus,
        .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .form-group input::placeholder { color: var(--text-muted); }
        .form-group select option { background: var(--bg-card); color: var(--text-primary); }

        /* Submit button */
        .btn-submit {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: all 0.25s; margin-top: 8px;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
        .btn-submit:active { transform: scale(0.98); }

        /* Footer */
        .auth-footer { text-align: center; margin-top: 22px; font-size: 13px; color: var(--text-muted); }
        .auth-footer a { color: var(--primary-light); text-decoration: none; font-weight: 500; transition: color 0.2s; }
        .auth-footer a:hover { color: var(--primary); }

        /* Message box */
        #messageBox { margin-top: 12px; text-align: center; font-size: 13px; min-height: 20px; }
        .error-text   { color: var(--danger); }
        .success-text { color: var(--success); }

        /* Responsive */
        @media (max-width: 500px) {
            .form-grid { grid-template-columns: 1fr; }
            .auth-wrapper { padding: 36px 24px; }
        }
    </style>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-header">
        <div class="logo"><i class="ph ph-ticket"></i></div>
        <h2>Create Account</h2>
        <p>Join EventBook and start booking amazing events</p>
    </div>
    <form id="registerForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" required placeholder="John">
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" required placeholder="Doe">
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="johndoe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="john@email.com">
            </div>
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" required placeholder="+94 71 234 5678">
            </div>

            <div class="form-group full">
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="123 Main Street, Colombo">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Min 6 characters">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required placeholder="Repeat password">
            </div>
        </div>
        <button type="submit" class="btn-submit">Create Account</button>
        <div id="messageBox"></div>
    </form>
    <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a><br>
        <a href="admin-portal.html" style="margin-top:8px;display:inline-block">← Back to Home</a>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
